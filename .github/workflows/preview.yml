name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Approval gate: skipped for trusted authors (bradymadden97), required for external contributors.
  # Configure the "pr-preview" environment in GitHub Settings > Environments with yourself
  # as a required reviewer to gate deployments from untrusted forks.
  approve:
    name: Await Approval
    runs-on: ubuntu-latest
    environment: pr-preview
    if: github.event.pull_request.user.login != 'bradymadden97' && github.actor != 'bradymadden97'
    steps:
      - run: echo "Deployment approved"

  deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: approve
    if: always() && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Deploy Preview to Cloudflare Workers
        run: npx wrangler deploy --name cartographers-game-pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const workerName = `cartographers-game-pr-${pr}`;
            const subdomain = '${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}';
            const url = `https://${workerName}.${subdomain}.workers.dev`;
            const body = [
              '### Preview deployment',
              '',
              `Worker: \`${workerName}\``,
              `URL: ${url}`,
              '',
              '> This comment updates on every push to this PR.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Preview deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr,
                body,
              });
            }
